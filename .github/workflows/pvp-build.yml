name: Leaf-PvP build

on:
  push:
    branches: [ "pvp" ]
  workflow_dispatch:
    inputs:
      export_sources:
        description: "Also upload the patched sources (for writing PvP changes)"
        required: false
        default: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      MC_VERSION: "26.3"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: gradle

      - name: Configure Git
        run: |
          git config --global user.email "no-reply@github.com"
          git config --global user.name "Github Actions"

      - name: Apply Leaf's patches
        run: ./gradlew applyAllPatches --stacktrace --no-daemon

      - name: Apply the Leaf-PvP changes
        run: bash pvp/apply.sh

      - name: Export the patched sources
        if: ${{ github.event.inputs.export_sources == 'true' }}
        run: |
          mkdir -p export
          for d in leaf-server/src/minecraft/java paper-server/src/main/java leaf-server/src/main/java leaf-api/src/main/java paper-api/src/main/java; do
            if [ -d "$d" ]; then tar -czf "export/$(echo "$d" | tr '/' '_').tar.gz" -C "$d" .; fi
          done
          ls -la export

      - name: Upload the patched sources
        if: ${{ github.event.inputs.export_sources == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: sources
          path: export/
          retention-days: 7

      - name: Build the Paperclip jar
        run: ./gradlew createPaperclipJar --stacktrace --no-daemon

      - name: Collect the jar
        run: |
          mkdir -p out
          find . -path ./out -prune -o -name "*paperclip*.jar" -print | grep -v "/cache/" | while read -r f; do cp "$f" out/; done
          ls -la out
          short=$(git rev-parse --short HEAD)
          for f in out/*.jar; do mv "$f" "out/leaf-pvp-${MC_VERSION}-${{ github.run_number }}-${short}.jar"; break; done
          (cd out && sha256sum *.jar | tee SHA256SUMS.txt)

      - name: Boot test (starts, /leaf reload writes leaf-pvp.yml, stops)
        run: |
          mkdir -p boot && cd boot
          echo "eula=true" > eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\nspawn-protection=0\n' > server.properties
          jar=$(realpath "$(ls ../out/*.jar | head -n1)")
          mkfifo console.in
          sleep 100000 > console.in &
          holder=$!
          java -Xmx2G -jar "$jar" nogui < console.in > boot.log 2>&1 &
          server=$!
          for i in $(seq 1 600); do
            grep -q "Done (" boot.log && break
            kill -0 $server 2>/dev/null || break
            sleep 1
          done
          grep "Done (" boot.log || { echo "server did not start"; tail -n 200 boot.log; exit 1; }
          echo "leaf reload" > console.in
          sleep 10
          echo "stop" > console.in
          for i in $(seq 1 90); do kill -0 $server 2>/dev/null || break; sleep 1; done
          kill $server $holder 2>/dev/null || true
          grep -i "running\|Leaf-PvP" boot.log | head -n 20
          test -f leaf-pvp.yml || { echo "leaf-pvp.yml was not written"; tail -n 100 boot.log; exit 1; }
          cat leaf-pvp.yml
          grep -n "Exception" boot.log || true
          if grep -n "at io\.github\.lmalololol\.leafpvp" boot.log; then echo "Leaf-PvP code in a stack trace"; tail -n 150 boot.log; exit 1; fi

      - name: Upload the server jar
        uses: actions/upload-artifact@v4
        with:
          name: server-jar
          path: out/
          retention-days: 30
          if-no-files-found: error

      - name: Publish a release (pushes to pvp only)
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short=$(git rev-parse --short HEAD)
          tag="${MC_VERSION}-${{ github.run_number }}-${short}"
          gh release create "$tag" out/*.jar out/SHA256SUMS.txt --target "${{ github.sha }}" --latest \
            --title "Leaf-PvP ${MC_VERSION} build ${{ github.run_number }}" \
            --notes "Leaf ver/${MC_VERSION} with the Leaf-PvP changes (see PVP.md). Built by GitHub Actions run ${{ github.run_id }} from ${short}."
